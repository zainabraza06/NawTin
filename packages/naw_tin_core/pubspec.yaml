name: naw_tin_core
description: >-
  Naw Tin's pure-Dart game core: board data, rules engine, begi/treghi patterns,
  and the negamax AI. Shared by the Flutter app and the online-play server.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

# No runtime dependencies on purpose: no Flutter, no Riverpod, no I/O.
dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
