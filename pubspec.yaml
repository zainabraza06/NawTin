name: nawtin
description: "Naw Tin - a premium 2-player and vs-AI board game."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

# Stage 1 is a pure-Dart rules engine, so no runtime packages are needed yet.
# State management for later stages: Riverpod (flutter_riverpod).
dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  # shared rules engine + AI (also used by the online server)
  naw_tin_core:
    path: packages/naw_tin_core
  flutter_riverpod: ^3.4.3
  google_fonts: ^9.0.0
  google_mobile_ads: ^9.1.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  connectivity_plus: ^7.3.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # in-process online server, used only by tests (never shipped)
  naw_tin_server:
    path: server
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Bundled so the game looks identical offline; google_fonts finds them here.
    - assets/google_fonts/
    # generated by tool/make_sounds.py (replace with recordings any time)
    - assets/audio/
    # optional local-language voice lines, see assets/audio/voice/README.md
    - assets/audio/voice/

# Regenerate launcher icons after changing assets/icon/*.png:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#070B1F"
    theme_color: "#8B5CF6"
  adaptive_icon_background: "#0B1030"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
